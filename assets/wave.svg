<svg xmlns="http://www.w3.org/2000/svg" width="760" height="120" viewBox="0 0 760 120">
<defs>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="30">
<stop offset="0" class="g0"/>
<stop offset="0.4" class="g0"/>
<stop offset="0.5" class="g1"/>
<stop offset="0.6" class="g0"/>
<stop offset="1" class="g0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-340 0;1100 0" dur="3.6s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
.g0{stop-color:#57606a}
.g1{stop-color:#0969da}
.sp{fill:#0969da;opacity:0;transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@media (prefers-color-scheme:dark){
.g0{stop-color:#6e7681}
.g1{stop-color:#ffffff}
.sp{fill:#ffffff}
}
</style>
<text fill="url(#shine)" x="40" y="45" font-size="30">你好，我是 lioooeeoooil-ux。</text>
<text fill="url(#shine)" x="40" y="92" font-size="16">正在探索人和 AI 如何协作写作，喜欢把新想法做成真实、有用的作品。</text>
<g transform="translate(120 14)"><path class="sp" style="animation-delay:0s;animation-duration:2.6s" d="M0,-4 C0.8,-1.2 1.2,-0.8 4,0 C1.2,0.8 0.8,1.2 0,4 C-0.8,1.2 -1.2,0.8 -4,0 C-1.2,-0.8 -0.8,-1.2 0,-4 Z"/></g>
<g transform="translate(300 10)"><path class="sp" style="animation-delay:-0.9s;animation-duration:3.1s" d="M0,-4 C0.8,-1.2 1.2,-0.8 4,0 C1.2,0.8 0.8,1.2 0,4 C-0.8,1.2 -1.2,0.8 -4,0 C-1.2,-0.8 -0.8,-1.2 0,-4 Z"/></g>
<g transform="translate(470 16)"><path class="sp" style="animation-delay:-1.7s;animation-duration:2.8s" d="M0,-4 C0.8,-1.2 1.2,-0.8 4,0 C1.2,0.8 0.8,1.2 0,4 C-0.8,1.2 -1.2,0.8 -4,0 C-1.2,-0.8 -0.8,-1.2 0,-4 Z"/></g>
<g transform="translate(200 68)"><path class="sp" style="animation-delay:-0.5s;animation-duration:3.4s" d="M0,-4 C0.8,-1.2 1.2,-0.8 4,0 C1.2,0.8 0.8,1.2 0,4 C-0.8,1.2 -1.2,0.8 -4,0 C-1.2,-0.8 -0.8,-1.2 0,-4 Z"/></g>
<g transform="translate(420 70)"><path class="sp" style="animation-delay:-2.2s;animation-duration:2.5s" d="M0,-4 C0.8,-1.2 1.2,-0.8 4,0 C1.2,0.8 0.8,1.2 0,4 C-0.8,1.2 -1.2,0.8 -4,0 C-1.2,-0.8 -0.8,-1.2 0,-4 Z"/></g>
